<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5fb3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>

  <!-- ===== Control PC (uri process) ===== -->
  <rect x="20" y="20" width="380" height="520" rx="10" fill="#f5f8ff" stroke="#2f5fb3" stroke-width="1.5"/>
  <text x="36" y="44" font-weight="bold" font-size="15" fill="#2f5fb3">Control PC — uri process</text>

  <!-- mc_rtc -->
  <rect x="40" y="60" width="340" height="80" rx="8" fill="#fff4e5" stroke="#c77a1f"/>
  <text x="210" y="85" text-anchor="middle" font-weight="bold">mc_rtc controller</text>
  <text x="210" y="105" text-anchor="middle" fill="#333">MCGlobalController, loaded through the</text>
  <text x="210" y="123" text-anchor="middle" fill="#333">robot_controller plugin (Controller: mc_rtc)</text>

  <!-- RobotManager -->
  <rect x="40" y="170" width="340" height="100" rx="8" fill="#ffffff" stroke="#2f5fb3"/>
  <text x="210" y="195" text-anchor="middle" font-weight="bold">RobotManager</text>
  <text x="210" y="215" text-anchor="middle" fill="#333">reads the Robots: section of mc_rtc.yaml</text>
  <text x="210" y="233" text-anchor="middle" fill="#333">spawns co-located RobotInterfaces (autostart)</text>
  <text x="210" y="251" text-anchor="middle" fill="#333">init handshake, then drives the main loop</text>

  <line x1="210" y1="140" x2="210" y2="170" stroke="#444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- FMInterfaceTemplate x2 -->
  <rect x="40" y="300" width="340" height="90" rx="8" fill="#ffffff" stroke="#2f5fb3"/>
  <text x="210" y="328" text-anchor="middle" font-weight="bold">FMInterfaceTemplate · ur5e</text>
  <text x="210" y="348" text-anchor="middle" fill="#333">manager-side proxy of one robot</text>
  <text x="210" y="366" text-anchor="middle" fill="#333">robot_comm server role</text>

  <rect x="40" y="420" width="340" height="90" rx="8" fill="#ffffff" stroke="#2f5fb3"/>
  <text x="210" y="448" text-anchor="middle" font-weight="bold">FMInterfaceTemplate · openarm</text>
  <text x="210" y="468" text-anchor="middle" fill="#333">manager-side proxy of one robot</text>
  <text x="210" y="486" text-anchor="middle" fill="#333">robot_comm server role</text>

  <line x1="210" y1="270" x2="210" y2="300" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== robot_comm middle band ===== -->
  <text x="510" y="282" text-anchor="middle" font-weight="bold" fill="#555">robot_comm</text>
  <text x="510" y="298" text-anchor="middle" font-size="12" fill="#555">Zenoh transport + FlatBuffers</text>

  <!-- ur5e topics -->
  <text x="510" y="316" text-anchor="middle" font-size="12" fill="#2f5fb3">ur5e/init  (query / reply)</text>
  <line x1="382" y1="322" x2="618" y2="322" stroke="#2f5fb3" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow-blue)"/>
  <text x="510" y="341" text-anchor="middle" font-size="12" fill="#2f5fb3">ur5e/command</text>
  <line x1="382" y1="347" x2="618" y2="347" stroke="#2f5fb3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="510" y="366" text-anchor="middle" font-size="12" fill="#2e7d4f">ur5e/state</text>
  <line x1="618" y1="372" x2="382" y2="372" stroke="#2e7d4f" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- openarm topics -->
  <text x="510" y="436" text-anchor="middle" font-size="12" fill="#2f5fb3">openarm/init  (query / reply)</text>
  <line x1="382" y1="442" x2="618" y2="442" stroke="#2f5fb3" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow-blue)"/>
  <text x="510" y="461" text-anchor="middle" font-size="12" fill="#2f5fb3">openarm/command</text>
  <line x1="382" y1="467" x2="618" y2="467" stroke="#2f5fb3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="510" y="486" text-anchor="middle" font-size="12" fill="#2e7d4f">openarm/state</text>
  <line x1="618" y1="492" x2="382" y2="492" stroke="#2e7d4f" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <text x="730" y="530" text-anchor="middle" font-size="11" fill="#666">dashed box: RobotInterface spawned by uri (robot_interface.autostart: true)</text>

  <!-- ===== Robot side ===== -->
  <rect x="620" y="300" width="220" height="90" rx="8" fill="#eef8f1" stroke="#2e7d4f"/>
  <text x="730" y="325" text-anchor="middle" font-weight="bold">RobotInterface · ur5e</text>
  <text x="730" y="345" text-anchor="middle" fill="#333">on the robot-side PC</text>
  <text x="730" y="365" text-anchor="middle" fill="#333">loads RobotDriverRTDE.so</text>

  <rect x="620" y="420" width="220" height="90" rx="8" fill="#eef8f1" stroke="#2e7d4f" stroke-dasharray="6 3"/>
  <text x="730" y="445" text-anchor="middle" font-weight="bold">RobotInterface · openarm</text>
  <text x="730" y="465" text-anchor="middle" fill="#333">same PC as uri (autostart)</text>
  <text x="730" y="485" text-anchor="middle" fill="#333">loads RobotDriverROS2Control.so</text>

  <!-- Hardware -->
  <rect x="870" y="300" width="210" height="90" rx="8" fill="#f1f3f4" stroke="#5f6368"/>
  <text x="975" y="330" text-anchor="middle" font-weight="bold">UR5e controller</text>
  <text x="975" y="352" text-anchor="middle" fill="#333">vendor API (RTDE)</text>

  <rect x="870" y="420" width="210" height="90" rx="8" fill="#f1f3f4" stroke="#5f6368"/>
  <text x="975" y="450" text-anchor="middle" font-weight="bold">OpenArm</text>
  <text x="975" y="472" text-anchor="middle" fill="#333">ros2_control (sim or real)</text>

  <line x1="840" y1="345" x2="870" y2="345" stroke="#444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="840" y1="465" x2="870" y2="465" stroke="#444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ===== Key ideas ===== -->
  <rect x="620" y="20" width="460" height="250" rx="10" fill="#fafafa" stroke="#bbb"/>
  <text x="640" y="48" font-weight="bold" font-size="15">Key ideas</text>
  <text x="640" y="78" fill="#333">• One uri process runs mc_rtc for the whole fleet.</text>
  <text x="640" y="104" fill="#333">• One RobotInterface process per robot, on the robot's</text>
  <text x="652" y="122" fill="#333">own PC or on the control PC.</text>
  <text x="640" y="148" fill="#333">• Robot-specific code is a RobotDriver plugin (.so),</text>
  <text x="652" y="166" fill="#333">loaded at runtime. No mc_rtc dependency needed.</text>
  <text x="640" y="192" fill="#333">• Both sides talk only through robot_comm topics,</text>
  <text x="652" y="210" fill="#333">so transport and serializer are swappable.</text>
  <text x="640" y="236" fill="#333">• Adding a robot = a driver plugin + one entry in</text>
  <text x="652" y="254" fill="#333">the Robots: section of mc_rtc.yaml.</text>
</svg>
